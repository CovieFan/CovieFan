name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    # UTC 01:17 = 北京时间 09:17；定时任务可能排队延迟。
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate profile, languages and contribution calendar
        uses: lowlighter/metrics@latest
        with:
          user: CovieFan
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai
          config_order: base.header, base.activity+community, base.repositories, languages, isocalendar
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
